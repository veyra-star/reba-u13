name: Agente indipendente FIP
on:
  schedule:
    - cron: '17 6,7,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Check official FIP independently
        id: check
        continue-on-error: true
        run: python agente/monitor_fip.py
      - name: Save independent monitor data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agente/risultati.json agente/stato.json agente/diagnostica.json
          if ! git diff --cached --quiet; then
            git commit -m "Agente: verifica autonoma FIP"
            git push
          fi
      - name: Report failed FIP verification
        if: steps.check.outcome == 'failure'
        run: exit 1

name: Aggiorna risultati FIP

on:
  schedule:
    - cron: '17 6-22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_fip.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifica fascia oraria italiana
        id: local_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          local = datetime.now(ZoneInfo('Europe/Rome'))
          enabled = os.environ['EVENT_NAME'] != 'schedule' or 8 <= local.hour <= 23
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={str(enabled).lower()}\n')
          print(f'Ora italiana: {local.isoformat()}; eseguire: {enabled}')
          PY

      - name: Installa dipendenze
        if: steps.local_time.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Recupera risultati FIP
        if: steps.local_time.outputs.run == 'true'
        run: python scripts/update_fip.py

      - name: Salva aggiornamenti
        if: steps.local_time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico risultati FIP"
            git push
          else
            echo "Nessun nuovo risultato da salvare."
          fi

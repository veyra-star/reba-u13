name: Aggiorna risultati FIP
on:
  schedule:
    # Run even when GitHub starts a scheduled event late.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_fip.py'
      - 'scripts/fip_common.py'
      - 'scripts/verify_published.py'
      - 'tests/test_fip*.py'
      - 'tests/fip_venue_cases.py'
      - 'tests/fixtures/fip*.html'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  # Serialize both writers so their result commits do not race.
  group: reba-fip-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test FIP parsing and reliability
        run: |
          python -m unittest discover -s tests -p 'test_fip*.py' -v
          python -m unittest discover -s tests -p 'fip_venue_cases.py' -v
      - name: Check official FIP
        id: check
        continue-on-error: true
        run: python scripts/update_fip.py
      - name: Save results and diagnostic status
        if: ${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico risultati FIP"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            echo "Failed to save FIP data after five attempts." >&2
            exit 1
          fi
      - name: Report incomplete FIP check
        if: steps.check.outcome == 'failure'
        run: exit 1
      - name: Verify scores actually published on the site
        if: steps.check.outcome == 'success'
        run: python scripts/verify_published.py
